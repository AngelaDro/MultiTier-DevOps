- name: Run MySQL container
  hosts: mysql
  become: yes

  tasks:
    - name: Pull MySQL image
      docker_image:
        name: mysql
        source: pull

    - name: Run MySQL container
      docker_container:
        name: mysql
        image: mysql
        state: started
        restart_policy: always
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
        ports:
          - "3306:3306"

