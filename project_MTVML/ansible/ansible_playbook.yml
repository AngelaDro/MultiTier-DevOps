---
- name: Configure MySQL server
  hosts: mysql
  become: true
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install MySQL server
      apt:
        name: mysql-server
        state: present

    - name: Ensure MySQL service is running
      service:
        name: mysql
        state: started
        enabled: true

    - name: Secure MySQL installation
      command: mysql_secure_installation
      args:
        creates: /root/.my.cnf
      environment:
        MYSQL_ROOT_PASSWORD: "{{ lookup('env', 'MYSQL_ROOT_PASSWORD') | default('securepassword', true) }}"

- name: Configure Memcached server
  hosts: memcached
  become: true
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install Memcached
      apt:
        name: memcached
        state: present

    - name: Ensure Memcached service is running
      service:
        name: memcached
        state: started
        enabled: true

- name: Configure RabbitMQ server
  hosts: rabbitmq
  become: true
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Add RabbitMQ signing key
      apt_key:
        url: https://keys.openpgp.org/vks/v1/by-fingerprint/0A9AF2115F4687BD29803A206B73A36E6026DFCA
        state: present

    - name: Add RabbitMQ repository
      apt_repository:
        repo: deb https://dl.bintray.com/rabbitmq/debian bionic main
        state: present
        filename: rabbitmq

    - name: Install RabbitMQ server
      apt:
        name: rabbitmq-server
        state: present

    - name: Ensure RabbitMQ service is running
      service:
        name: rabbitmq-server
        state: started
        enabled: true

    - name: Enable RabbitMQ management plugin
      command: rabbitmq-plugins enable rabbitmq_management
      args:
        creates: /etc/rabbitmq/enabled_plugins

- name: Configure Tomcat server
  hosts: tomcat
  become: true
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install OpenJDK
      apt:
        name: openjdk-11-jdk
        state: present

    - name: Install Tomcat
      apt:
        name: tomcat9
        state: present

    - name: Ensure Tomcat service is running
      service:
        name: tomcat9
        state: started
        enabled: true

- name: Configure Nginx server
  hosts: nginx
  become: true
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install Nginx
      apt:
        name: nginx
        state: present

    - name: Ensure Nginx service is running
      service:
        name: nginx
        state: started
        enabled: true

    - name: Configure Nginx to proxy to Tomcat
      template:
        src: templates/nginx-tomcat.conf.j2
        dest: /etc/nginx/sites-available/tomcat
        mode: '0644'
      notify: Restart Nginx

  handlers:
    - name: Restart Nginx
      service:
        name: nginx
        state: restarted