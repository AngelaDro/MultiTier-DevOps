---
- name: Install Jenkins with AWS CLI, Docker, and system configuration
  hosts: all
  become: true
  vars:
    java_packages:
      - fontconfig
      - openjdk-21-jre
    utils_packages:
      - apt-transport-https
      - wget
      - curl
      - gnupg
      - software-properties-common
      - git
      - xmlstarlet
      - unzip
      - cron

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install Java packages
      apt:
        name: "{{ java_packages }}"
        state: present

    - name: Install utility packages
      apt:
        name: "{{ utils_packages }}"
        state: present

    # ---------------- Jenkins Installation ----------------

    - name: Add Jenkins apt repository key
      get_url:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2023.key
        dest: /usr/share/keyrings/jenkins-keyring.asc
        mode: '0644'

    - name: Add Jenkins apt repository
      apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
        filename: jenkins
        state: present

    - name: Update apt cache after adding Jenkins repo
      apt:
        update_cache: yes

    - name: Install Jenkins
      apt:
        name: jenkins
        state: present

    - name: Enable and start Jenkins service
      systemd:
        name: jenkins
        enabled: yes
        state: started
        daemon_reload: yes

    - name: Allow Jenkins user to sudo without password
      lineinfile:
        path: /etc/sudoers.d/jenkins
        create: yes
        mode: '0440'
        line: 'jenkins ALL=(ALL) NOPASSWD: ALL'
        validate: '/usr/sbin/visudo -cf %s'

    # ---------------- AWS CLI ----------------

    - name: Download AWS CLI v2 zip
      get_url:
        url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
        dest: /tmp/awscliv2.zip
        mode: '0644'

    - name: Unzip AWS CLI
      unarchive:
        src: /tmp/awscliv2.zip
        dest: /tmp
        remote_src: yes

    - name: Install AWS CLI
      command: /tmp/aws/install
      args:
        creates: /usr/local/bin/aws

    - name: Clean up AWS CLI archive
      file:
        path: /tmp/awscliv2.zip
        state: absent

    # ---------------- Docker Installation ----------------

    - name: Install Docker dependencies
      apt:
        name: ["ca-certificates", "curl", "gnupg"]
        state: present

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker APT repository
      apt_repository:
        repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu jammy stable
        state: present

    - name: Update apt and install Docker
      apt:
        name: ["docker-ce", "docker-ce-cli", "containerd.io"]
        state: present
        update_cache: yes

    - name: Add Jenkins user to Docker group
      user:
        name: jenkins
        groups: docker
        append: yes

    - name: Ensure Docker service is running
      systemd:
        name: docker
        enabled: yes
        state: started
        daemon_reload: yes

    # ---------------- Jenkins IP Auto-Update ----------------

    - name: Create a script to update Jenkins public IP at boot
      copy:
        dest: "/usr/local/bin/update_jenkins_ip.sh"
        mode: '0755'
        content: |
          #!/bin/bash
          IP=$(curl -s http://169.254.169.254/latest/meta-data/public-ipv4)
          CONFIG_FILE="/var/lib/jenkins/jenkins.model.JenkinsLocationConfiguration.xml"
          if [ -f "$CONFIG_FILE" ]; then
            xmlstarlet ed --inplace -u "/jenkins.model.JenkinsLocationConfiguration/jenkinsUrl" -v "http://${IP}:8080/" "$CONFIG_FILE"
            systemctl restart jenkins
          fi

    - name: Add script to crontab to update IP on reboot
      cron:
        name: "Update Jenkins public IP at reboot"
        special_time: reboot
        job: "/usr/local/bin/update_jenkins_ip.sh"
