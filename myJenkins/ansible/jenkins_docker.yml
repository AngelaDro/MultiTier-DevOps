---
- name: Install Jenkins in Docker with AWS CLI and system utilities
  hosts: all
  become: true
  gather_facts: yes

  vars:
    java_packages:
      - fontconfig
      - openjdk-21-jre
    utils_packages:
      - apt-transport-https
      - wget
      - curl
      - gnupg
      - software-properties-common
      - git
      - xmlstarlet
      - unzip
      - cron
    docker_dependencies:
      - ca-certificates
      - curl
      - gnupg
      - unzip

  tasks:
    # ---------------- Base packages ----------------

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install utility packages
      apt:
        name: "{{ utils_packages + java_packages }}"
        state: present
    - name: Install python docker module
      pip:
        name: docker

    # ---------------- Setup AWS CLI ----------------

    - name: Download AWS CLI v2 zip
      get_url:
        url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
        dest: /tmp/awscliv2.zip
        mode: '0644'

    - name: Unzip AWS CLI
      unarchive:
        src: /tmp/awscliv2.zip
        dest: /tmp
        remote_src: yes

    - name: Install AWS CLI
      command: /tmp/aws/install
      args:
        creates: /usr/local/bin/aws

    - name: Clean up AWS CLI archive
      file:
        path: /tmp/awscliv2.zip
        state: absent

    # ---------------- Setup Docker ----------------

    - name: Install Docker dependencies
      apt:
        name: "{{ docker_dependencies }}"
        state: present
        update_cache: yes

    - name: Add Docker official GPG key with apt-key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker APT repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        filename: docker
        state: present

    - name: Update apt cache after adding Docker repo
      apt:
        update_cache: yes

    - name: Install Docker Engine
      apt:
        name: ["docker-ce", "docker-ce-cli", "containerd.io"]
        state: present

    - name: Add current user (ubuntu) to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Ensure Docker service is running
      systemd:
        name: docker
        enabled: yes
        state: started
        daemon_reload: yes

    # ---------------- Jenkins into container ----------------

    - name: Ensure Docker volume exists
      docker_volume:
        name: jenkins_home

    - name: Ensure Jenkins build directory exists
      file:
        path: /opt/jenkins
        state: directory
        mode: '0755'

    - name: Copy Jenkins Dockerfile
      copy:
        src: jenkins.Dockerfile
        dest: /opt/jenkins/Dockerfile
        mode: '0644'

    - name: Copy plugins.txt
      copy:
        src: plugins.txt
        dest: /opt/jenkins/plugins.txt
        mode: '0644'

    - name: Build Jenkins Docker image
      command: docker build -t my-jenkins /opt/jenkins
      args:
        chdir: /opt/jenkins

    - name: Stop existing Jenkins container (if any)
      docker_container:
        name: jenkins
        state: stopped
      ignore_errors: yes

    - name: Remove existing Jenkins container (if any)
      docker_container:
        name: jenkins
        state: absent
      ignore_errors: yes

    - name: Run Jenkins container with Docker socket
      docker_container:
        name: jenkins
        image: my-jenkins
        state: started
        restart_policy: unless-stopped
        published_ports:
          - "8080:8080"
          - "50000:50000"
        volumes:
          - jenkins_home:/var/jenkins_home
          - /var/run/docker.sock:/var/run/docker.sock