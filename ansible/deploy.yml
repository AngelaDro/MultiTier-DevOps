---
- name: Deploy Java app to Tomcat server
  hosts: tomcat
  become: yes
  vars:
    aws_region: "{{ lookup('env', 'AWS_REGION') | default('us-east-1') }}"
    aws_access_key: "{{ lookup('env', 'AWS_ACCESS_KEY_ID') }}"
    aws_secret_key: "{{ lookup('env', 'AWS_SECRET_ACCESS_KEY') }}"

  tasks:
    - name: Set ECR registry
      set_fact:
        ecr_registry: "{{ ecr_repo.split('/')[0] }}"

    - name: Login to AWS ECR
      community.docker.docker_login:
        registry_url: "{{ ecr_registry }}"
        username: "{{ aws_access_key }}"
        password: "{{ aws_secret_key }}"

    - name: Pull Docker image from AWS ECR
      community.docker.docker_image:
        name: "{{ ecr_repo }}"
        tag: "{{ image_tag }}"
        source: pull

    - name: Stop and remove old container (if running)
      community.docker.docker_container:
        name: tomcat-app
        state: absent
        force_kill: true
        timeout: 10

    - name: Run new Docker container
      community.docker.docker_container:
        name: tomcat-app
        image: "{{ ecr_repo }}:{{ image_tag }}"
        state: started
        restart_policy: always
        published_ports:
          - "8080:8080"
