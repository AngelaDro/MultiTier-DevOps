---
- name: Deploy Java app to Tomcat server
  hosts: tomcat
  become: yes
  vars:
    image_tag: "latest"
    ecr_repo: "https://github.com/AngelaDro/MultiTier-DevOps.git"
  tasks:
    - name: Login to AWS ECR
      shell: |
        aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin {{ ecr_repo }}
      environment:
        AWS_ACCESS_KEY_ID: "{{ lookup('env', 'AWS_ACCESS_KEY_ID') }}"
        AWS_SECRET_ACCESS_KEY: "{{ lookup('env', 'AWS_SECRET_ACCESS_KEY') }}"

    - name: Pull image
      shell: docker pull {{ ecr_repo }}:{{ image_tag }}

    - name: Stop old container (if running)
      shell: docker stop tomcat-app || true

    - name: Remove old container
      shell: docker rm tomcat-app || true

    - name: Run new container
      shell: docker run -d --name tomcat-app -p 8080:8080 {{ ecr_repo }}:{{ image_tag }}
