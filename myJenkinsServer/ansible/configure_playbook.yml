---
- name: Configure Jenkins as per Dockerfile setup
  hosts: all
  become: true

  tasks:

    - name: Install dependencies
      apt:
        name:
          - docker.io
          - unzip
          - curl
          - python3-pip
          - fontconfig
          - openjdk-11-jre-headless
        state: present
        update_cache: yes

    - name: Add Jenkins user to docker group
      user:
        name: jenkins
        groups: docker
        append: yes

    - name: Download AWS CLI v2
      get_url:
        url: "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip"
        dest: "/tmp/awscliv2.zip"

    - name: Unzip AWS CLI installer
      unarchive:
        src: "/tmp/awscliv2.zip"
        dest: "/tmp"
        remote_src: yes

    - name: Install AWS CLI v2
      shell: "/tmp/aws/install"
      args:
        creates: /usr/local/bin/aws

    - name: Remove AWS CLI temp files
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/aws"
        - "/tmp/awscliv2.zip"

    - name: Install Ansible via pip
      pip:
        name: ansible

    - name: Copy plugins.txt to Jenkins server
      copy:
        src: plugins.txt
        dest: /tmp/plugins.txt
        mode: '0644'

    - name: Download Jenkins Plugin Manager CLI (JAR)
      get_url:
        url: https://github.com/jenkinsci/plugin-installation-manager-tool/releases/download/2.13.2/jenkins-plugin-manager-2.13.2.jar
        dest: /opt/jenkins-plugin-manager.jar
        mode: '0755'

    - name: Install Jenkins plugins using plugin manager JAR
      shell: |
        java -jar /opt/jenkins-plugin-manager.jar \
          --plugin-file /tmp/plugins.txt
      environment:
        JENKINS_UC_DOWNLOAD: https://updates.jenkins.io

    - name: Set correct permissions for plugins
      file:
        path: /var/lib/jenkins/plugins
        recurse: yes
        owner: jenkins
        group: jenkins

    - name: Check if Jenkins plugins directory exists
      stat:
        path: /var/lib/jenkins/plugins
      register: plugins_dir

    - name: List plugins installed
      command: ls -1 /var/lib/jenkins/plugins
      register: plugins_list
      when: plugins_dir.stat.exists

    - name: Show installed plugins list
      debug:
        var: plugins_list.stdout_lines
      when: plugins_dir.stat.exists

    - name: Restart Jenkins
      systemd:
        name: jenkins
        state: restarted
